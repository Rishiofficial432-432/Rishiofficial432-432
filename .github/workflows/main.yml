name: Update profile art

# Refreshes contribution graph, stats card, info card SVGs daily from real data.
# Runs daily, plus whenever you push to main, plus on-demand.

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Job 1: animated contribution snake (existing) ────────────────────────
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Rishiofficial432-432
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: heatmap + stats card (new full pipeline) ──────────────────────
  profile-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Step A: scrape real contribution data (no auth needed)
      - name: Fetch real contribution data
        run: python scripts/fetch_contributions.py

      # Step B: animated contribution heatmap (53-week grid, diagonal reveal)
      - name: Render contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      # Step C: streak + numbers card (count-up tiles + monthly bar chart)
      - name: Render stats card SVG
        run: python scripts/render_stats_svg.py

      # Step D: neofetch-style info card (ASCII SMIT logo + profile info)
      - name: Render info card SVG
        run: python scripts/make_info_card.py

      # Step E: dark/light animated contribution grid (existing script)
      - name: Render animated contribution grid SVGs
        run: python scripts/generate_contribution_svgs.py --username Rishiofficial432-432 --outdir .

      # Step F: commit everything back
      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: >-
            data/contributions.json
            contrib-heatmap.svg
            stats.svg
            info-card.svg
            contributions-dark.svg
            contributions-light.svg
